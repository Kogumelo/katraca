<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="16" height="16">
  <!-- Logo da Katraca para 16px: tudo com espessura 13, cantos retos, sem o
       disco nem o furo do cubo, verde chapado. Mesmo desenho, mais grosso. -->
  <rect x="8" y="8" width="84" height="84" rx="19" fill="#1d7a50"/>
  <g fill="#fff">
    <rect x="30" y="20" width="13" height="60"/>
    <rect x="55" y="43.5" width="37" height="13" transform="rotate(180 55 50)"/>
    <rect x="55" y="43.5" width="37" height="13" transform="rotate(-60 55 50)"/>
    <rect x="55" y="43.5" width="37" height="13" transform="rotate(60 55 50)"/>
  </g>
</svg>
