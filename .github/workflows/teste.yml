name: teste
on: [push, pull_request]
jobs:
  teste:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: x
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          KATRACA_PG_URL: postgres://postgres:x@localhost:5432/postgres
  # Falhas conhecidas nas dependencias e no Go. So avisa: roda com o Go
  # estavel mais novo (o do go.mod e o minimo, e o govulncheck reprovaria
  # sempre pela biblioteca padrao dele), e um achado aparece como trabalho
  # vermelho sem reprovar o resto.
  vulnerabilidades:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
